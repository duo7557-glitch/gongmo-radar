name: Operations alerts

on:
  workflow_run:
    workflows: [IPO sync, Price history]
    types: [completed]

permissions:
  actions: read
  issues: write

jobs:
  notify-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `[운영 알림] ${run.name} 자동 갱신 실패`;
            const stamp = new Date(run.updated_at || run.created_at).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
            const body = `자동 갱신 작업이 실패했습니다.\n\n- 작업: ${run.name}\n- 시간(KST): ${stamp}\n- 실행 기록: ${run.html_url}\n- 커밋: ${run.head_sha}\n\nActions 실행 기록에서 실패한 단계를 확인해 주세요. 새로 성공 실행되면 이 알림은 자동으로 닫힙니다.`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const issue = issues.find(item => !item.pull_request && item.title === title);
            if (issue) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `다시 실패했습니다: ${run.html_url}` });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

  close-recovered-alert:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `[운영 알림] ${context.payload.workflow_run.name} 자동 갱신 실패`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const issue = issues.find(item => !item.pull_request && item.title === title);
            if (issue) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `다음 실행이 성공해 자동으로 닫습니다: ${context.payload.workflow_run.html_url}` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
            }
