name: IPO sync

on:
  push:
    paths:
      - 'tools/ipo-score.mjs'
      - 'tools/score-ipo.mjs'
      - 'tools/publish-ipo.mjs'
      - 'supabase/functions/_shared/dart.mjs'
      - '.github/workflows/ipo-sync.yml'
  schedule:
    # UTC 03/09/15/21 = Korea time 12/18/00/06
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      begin:
        description: 'Start date (YYYYMMDD; blank means recent 85 days)'
        required: false
      end:
        description: 'End date (YYYYMMDD)'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node tools/publish-ipo.mjs
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPABASE_URL: https://xwclwdxerhxrjmpexzga.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DART_BEGIN_DATE: ${{ github.event.inputs.begin }}
          DART_END_DATE: ${{ github.event.inputs.end }}
      - run: node tools/score-ipo.mjs
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPABASE_URL: https://xwclwdxerhxrjmpexzga.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
